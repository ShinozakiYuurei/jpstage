# 临时配置：只监听 80，供 certbot 做 HTTP-01 验证。
#
# 由 deploy/remote-init.sh 送到服务器 /tmp，替换 __DOMAIN__ 后启用；
# 拿到证书后会被 deploy/nginx-jpstage.conf 的完整版（含 443）覆盖。
#
# ★ 为什么需要这个「中间态」而不是直接装完整配置：
#   完整配置里的 ssl_certificate 指向证书文件，而 nginx 在 **load 配置时**
#   就要求该文件存在 —— 证书还没签，nginx -t 会直接失败、reload 被拒，
#   站点连 80 都用不了。所以必须先用一份不含 ssl 的配置把 80 撑起来，
#   让 ACME 验证能过，签完再换完整版。
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # ACME HTTP-01 验证路径
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
        access_log off;
    }

    # 其余路径返回一句明确的占位文本。
    # ★ 不用 301 跳 https：此刻 https 还没有证书，跳过去只会让 CF 报 525，
    #   而那会掩盖「其实只是证书还没签」这个真实状态。
    location / {
        default_type "text/plain";
        return 200 'jpstage: awaiting certificate\n';
    }
}
