# 2.5 次元舞台劇資料庫 · nginx 站点配置
#
# 部署位置：宿主机 /home/web/conf.d/jpstage.yuurei.de.conf
#   （由 nginx 容器以 host 网络读取，见 /home/web/docker-compose.yml）
#
# ⚠️ 本文件只新增一个 server 块，不修改/删除任何现有配置。
#    与已有站点（hkmovie / imgmove / komari）靠 server_name 区分，互不干扰。
#
# ════════════════════════════════════════════════════════════════════
#  ★ 站点根为什么是 /var/www/jpstage 而不是 /var/www/html
# ════════════════════════════════════════════════════════════════════
#
#  hkmovie 与 imgmove 共用 /home/web/html（后者只服务其中的 /posters/）。
#  但 hkmovie 的重建脚本（deploy/rebuild-static.sh）在同步产物时执行的是：
#
#      find "${SITE_DIR}" -mindepth 1 -delete     # SITE_DIR=/home/web/html
#
#  也就是**清空整个目录**（为了保持目录 inode 不变，否则容器的 bind mount
#  会失效）。若把本站放进 /home/web/html/jpstage，hkmovie 每次重建都会
#  把它一起删掉 —— 而且是静默的：站点先是 404，直到有人发现才明白原因。
#
#  所以本站用独立目录 + 独立 bind mount（见 docker-compose.yml 的改动说明）。
#  代价是 nginx 容器需要重建一次（几百毫秒），换来两个站点彻底解耦。
#
# ════════════════════════════════════════════════════════════════════
#  ★ 证书：Let's Encrypt（不是 Cloudflare Origin Certificate）
# ════════════════════════════════════════════════════════════════════
#
#  服务器上已有的三个站点用的是 CF Origin Certificate（15 年有效期，
#  由 CF 面板签发）。本站改用 Let's Encrypt，原因是它**不需要人工介入**：
#  服务器上已有 /root/auto_cert_renewal.sh（每日 cron），它遍历
#  certs/*_cert.pem，对每张证书按同名 .conf 检查 letsencrypt 关键字，
#  到期前 15 天自动续签。只要本配置保留下面的 ACME location，续签就成立。
#
#  ★ 关键前提（2026-09-26 实测确认）：ACME HTTP-01 验证能穿过 Cloudflare。
#    实测 `curl http://jpstage.yuurei.de/.well-known/acme-challenge/<token>`
#    返回 200 且内容正确 —— 即 CF 对这条路径**不做**「Always Use HTTPS」
#    重定向（CF 对 ACME 路径有内建豁免）。
#    这一点必须先验证：若 CF 把它也 301 到 https，就会撞上
#    「要先有证书才能通过 https 验证、要先验证才能拿到证书」的死循环，
#    而那会让 Let's Encrypt 方案整体不可行。
#
#  ★ 顺序（首次部署必须按此顺序，否则 CF 报 525）：
#      1. 只启用 80 端口（含 ACME location）→ 跑 certbot 拿证书
#      2. 拿到证书后再启用 443 块 → reload
#    因为 CF 的 SSL/TLS 模式是 Full(strict)：源站 443 没有**有效**证书时，
#    CF 一律返回 525（实测 https://jpstage.yuurei.de 在部署前正是 525）。
#    deploy/remote-activate.sh 就是按这个顺序做的，不要手工打乱。

server {
    listen 80;
    listen [::]:80;
    server_name jpstage.yuurei.de;

    # ---------- ACME HTTP-01 验证 ----------
    # ★ 不可删除。certbot --webroot 会把 challenge 文件写进
    #   /home/web/letsencrypt/.well-known/acme-challenge/（容器内是
    #   /var/www/letsencrypt/...），Let's Encrypt 从公网取它来证明域名归属。
    #   删掉这段，证书到期后就无法自动续签 —— 而失败是静默的：
    #   直到证书过期、CF 开始 525，才会有人发现。
    #
    #   ^~ 前缀匹配：确保它优先于下面的 location /（否则会被 301 吃掉）。
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
        # 验证文件是临时的，不记录访问日志（省 IO，也让日志更干净）
        access_log off;
    }

    # 其余一律跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;

    server_name jpstage.yuurei.de;

    # ---------- Cloudflare 真实 IP 还原 ----------
    # 本站走 CF 小黄云（DNS 解析到 172.67.x / 104.21.x）。不还原的话
    # nginx 看到的 $remote_addr 全是 CF 的 IP，日志与任何限流都会失真。
    #
    # ⚠️ 与 hkmovie 的配置保持一致，不引入新写法：这段是从
    #    deploy/nginx-static.conf 逐行搬来的，已在线上验证可用。
    #    CF 的 IP 段会变，但变化频率很低；真变了 hkmovie 那边也会一起失效，
    #    两处同源便于一起更新（这也是不抽成 include 的理由：
    #    多一个间接层就多一处「以为改了其实没生效」）。
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ---------- 证书 ----------
    # 由 /root/auto_cert_renewal.sh 从 /etc/letsencrypt/live/ 复制过来。
    # 文件名必须是 <域名>_cert.pem / <域名>_key.pem —— 那个脚本靠
    # 遍历 certs/*_cert.pem 反推域名，命名不符就永远不会被续期。
    ssl_certificate     /etc/nginx/certs/jpstage.yuurei.de_cert.pem;
    ssl_certificate_key /etc/nginx/certs/jpstage.yuurei.de_key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # ★ 会话缓存池命名：**刻意与 hkmovie 不同**（它用 SSL_hkmovie）。
    #   同名会共享同一个池（省内存），但本站是独立站点，共用池会让
    #   「这张证书的会话恢复为什么受另一站影响」变成需要推理的问题。
    #   2m 约容纳 8000 个会话，对本站量级足够；服务器内存紧张（可用 600MB
    #   上下），不用 hkmovie 的 10m。
    ssl_session_cache shared:SSL_jpstage:2m;
    ssl_session_timeout 1d;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- 站点根 ----------
    # 见文件顶部说明：独立于 hkmovie 的 /var/www/html
    root /var/www/jpstage;
    index index.html;

    # ---------- Next.js 静态资源（文件名带 hash，可永久缓存）----------
    # 这一条对本站尤其重要：jpstage 的 CSS 有 47KB（液态玻璃令牌 + 三套主题），
    # 是首屏渲染的阻塞资源。immutable 让 CF 边缘与浏览器都能长期命中。
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---------- ACME（HTTPS 侧也保留一份）----------
    # 为什么 80 端口已经有了还要再来一次：CF 的 SSL 模式或回源策略若变化，
    # 验证请求有可能落到 443。两处都配，续签就不会因一次配置变动而静默失效。
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
        access_log off;
    }

    # ---------- RSC 预取请求：直接挡掉 ----------
    #
    # ★ 为什么必须单独处理（实测：线上控制台一片 404）：
    #   Next 的 <Link> 默认会为站内链接发一个预取请求，形如
    #     /now/__next.now.__PAGE__.txt?_rsc=xxxx
    #   在**动态**站上它由服务端实时生成；而本站是静态导出
    #   （output: 'export'），产物里那个文件的**目录层级与请求的路径不符**
    #   （产物是 out/now/__next.now/__PAGE__.txt，请求的是
    #   /now/__next.now.__PAGE__.txt），try_files 匹配不到 → 404。
    #
    #   这些 404 不影响渲染（预取失败而已，点链接照样正常跳转），
    #   但会在控制台刷一片红，也会污染 nginx 日志与任何前端监控。
    #
    # ★ 为什么是「返回 404 并记一条」而不是去补 try_files 规则：
    #   纯静态站没有服务端可预取 —— 预取命中了也不会更快
    #   （本地文件本来就在，点击是即时导航）。所以正确的处理是
    #   **让它快速明确地失败**，而不是花力气把它凑对。
    #   这里用 access_log off 避免把这类噪音写进日志。
    location ~ /__next\..*\.txt$ {
        access_log off;
        log_not_found off;
        return 404;
    }

    # ---------- 静态导出路由 ----------
    # /show/xxx → /show/xxx/index.html（next.config.ts 里 trailingSlash: true）
    # 顺序与 Next.js 静态导出的产物布局一致，也与 hkmovie 线上配置相同。
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Next.js 导出的 404 页需要显式接上，否则用户看到的是 nginx 默认页
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;
}
